name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Format check (ruff)
        run: uv run ruff format --check src tests

      - name: Type-check (mypy)
        run: uv run mypy src tests

      - name: Install ripgrep
        env:
          RIPGREP_VERSION: "15.2.0"
          RIPGREP_DEB_SHA256: "5af93eebe4c352474632cf1d28523b0e98bcd4e2f115a249a713b8d8c7d1d01c"
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            # From the release on GitHub, not apt: the Ubuntu mirrors are not always reachable from the runners.
            deb="ripgrep_${RIPGREP_VERSION}-1_amd64.deb"
            curl -fsSL -o "$deb" "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${deb}"
            echo "${RIPGREP_DEB_SHA256}  ${deb}" | sha256sum -c -
            sudo dpkg -i "$deb"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            brew install ripgrep
          fi

      - name: Test with coverage (pytest)
        run: uv run pytest -n auto --cov=aldwin --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=90

      - name: Connector coverage (core/connectors at 90%)
        run: uv run pytest tests/connectors -n auto -q --cov=aldwin.core.connectors --cov-report=term-missing --cov-fail-under=90

      - name: Perf budgets (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest -m perf -q

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml

      - name: Build package
        run: uv build

  security:
    name: security
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Install ripgrep
        env:
          RIPGREP_VERSION: "15.2.0"
          RIPGREP_DEB_SHA256: "5af93eebe4c352474632cf1d28523b0e98bcd4e2f115a249a713b8d8c7d1d01c"
        run: |
          # From the release on GitHub, not apt: the Ubuntu mirrors are not always reachable from the runners.
          deb="ripgrep_${RIPGREP_VERSION}-1_amd64.deb"
          curl -fsSL -o "$deb" "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${deb}"
          echo "${RIPGREP_DEB_SHA256}  ${deb}" | sha256sum -c -
          sudo dpkg -i "$deb"

      - name: Security + policy suite
        run: uv run pytest tests/security -q --tb=short

  web:
    name: web
    timeout-minutes: 25
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      # The suite serves out/ itself (playwright/serve.mjs) and fakes the host,
      # so no Python runs here.
      - name: End-to-end (Playwright)
        run: npm run test:pw

      - name: Component kit (Playwright on next dev)
        run: npm run test:pw:kit

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
