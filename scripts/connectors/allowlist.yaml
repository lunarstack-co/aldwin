# The apps offered in the connector catalogue, in display order.
# A registry app names the namespace its vendor publishes under in the official MCP
# Registry; a manual app gives its address from the vendor's own docs. See README.md.
vendors:
  - name: notion
    title: Notion
    purpose: Search, read and update pages and databases
    keywords: [notion, notes, wiki, docs]
    category: work
    docs_url: https://developers.notion.com/docs/mcp
    logo: simple-icons:notion
    source: registry
    namespace: com.notion
  - name: linear
    title: Linear
    purpose: Find, create and update issues and projects
    keywords: [linear, issue, ticket, project management]
    category: work
    docs_url: https://linear.app/docs/mcp
    logo: simple-icons:linear
    source: registry
    namespace: app.linear
    remote: https://mcp.linear.app/mcp
