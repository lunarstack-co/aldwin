app: VS Code
homepage: https://code.visualstudio.com/docs/agents/reference/mcp-configuration
verified: 2026-11-01
verified_from: source
format: jsonc
dialect: standard
servers_at: [[servers]]
locations:
  - scope: user
    paths:
      darwin: ~/Library/Application Support/Code/User/mcp.json
      linux: ~/.config/Code/User/mcp.json
  - scope: project
    paths: {any: "{workspace}/.vscode/mcp.json"}
