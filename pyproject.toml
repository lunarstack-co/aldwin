[project]
name = "aldwin"
version = "0.0.1"
description = "An open-source personal assistant that runs on your own computer, built on Agentling."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Folarin Akinloye", email = "me@folarin.dev" }
]
keywords = ["aldwin", "agentling", "assistant", "cli", "agents", "llm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "agentling>=0.1,<0.2",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "prompt-toolkit>=3.0.48",
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
    "trafilatura>=2.0.0",
    "pathspec>=0.12.0",
    "tzlocal>=5.2",
    "pypdfium2>=4.30.0",
    "mammoth>=1.8.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.14.0",
]

[project.urls]
Homepage = "https://askaldwin.com"
Repository = "https://github.com/lunarstack-co/aldwin"
Issues = "https://github.com/lunarstack-co/aldwin/issues"
Changelog = "https://github.com/lunarstack-co/aldwin/blob/main/CHANGELOG.md"
Documentation = "https://github.com/lunarstack-co/aldwin#readme"

[project.optional-dependencies]
docs = [
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "reportlab>=4,<5",
]

[project.scripts]
aldwin = "aldwin.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aldwin"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/aldwin",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live and not perf'"
markers = [
    "live: calls the real OpenAI and Tavily APIs (run by hand)",
    "uninitialized_home: do not call ensure_home() in the autouse aldwin_home fixture",
    "perf: performance budget benchmarks (run by hand or on CI)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
mypy_path = "tests"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "trafilatura.*",
    "pypdfium2.*",
    "mammoth.*",
    "pptx.*",
    "openpyxl.*",
    "bs4.*",
    "markdownify.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.100.0",
    "types-PyYAML>=6.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]
